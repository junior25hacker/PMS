services:
  postgres:
    image: postgres:16-alpine
    container_name: pharmly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pharmly
    ports:
      - '5432:5432'
    volumes:
      - pharmly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pharmly']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pharmly-pgdata:
