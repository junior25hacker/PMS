<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharmly — Pharmacy Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">💊</span>
        <span class="brand-text">Pharmly</span>
      </div>
  <nav id="nav" class="sidebar-nav">
    <a href="#dashboard" data-route="dashboard" class="nav-link active">
      <span class="nav-icon">📊</span> Dashboard
    </a>
    <a href="#pos" data-route="pos" class="nav-link">
      <span class="nav-icon">🛒</span> Point of Sale
    </a>
    <a href="#prescriptions" data-route="prescriptions" class="nav-link">
      <span class="nav-icon">🩺</span> Prescriptions
    </a>
    <a href="#patients" data-route="patients" class="nav-link">
      <span class="nav-icon">🧑‍⚕️</span> Patients
    </a>
    <a href="#inventory" data-route="inventory" class="nav-link">
      <span class="nav-icon">💊</span> Medicines
    </a>
    <a href="#batches" data-route="batches" class="nav-link">
      <span class="nav-icon">📦</span> Batches
    </a>
    <a href="#purchases" data-route="purchases" class="nav-link">
      <span class="nav-icon">📋</span> Purchase Orders
    </a>
    <a href="#sales" data-route="sales" class="nav-link">
      <span class="nav-icon">🧾</span> Sales
    </a>
    <a href="#suppliers" data-route="suppliers" class="nav-link">
      <span class="nav-icon">🏢</span> Suppliers
    </a>
    <a href="#categories" data-route="categories" class="nav-link">
      <span class="nav-icon">🏷️</span> Categories
    </a>
    <a href="#users" data-route="users" class="nav-link">
      <span class="nav-icon">👥</span> Users
    </a>
  </nav>
      <div id="auth-section" class="sidebar-auth">
        <span id="auth-user"></span>
        <button id="logout-btn" class="btn-logout" style="display:none;">Logout</button>
      </div>
    </aside>
    <main id="main" class="main">
      <header id="topbar" class="topbar" style="display:none;">
        <button id="menu-toggle" class="menu-toggle">☰</button>
        <div id="topbar-title" class="topbar-title">Dashboard</div>
        <div id="topbar-search" class="topbar-search">
          <input type="text" id="global-search-input" placeholder="Search… (press /)" autocomplete="off">
          <div id="search-results" class="search-results"></div>
        </div>
      </header>
      <div id="page" class="page"></div>
    </main>
    <div id="toast-container" class="toast-container"></div>
    <div id="modal-overlay" class="modal-overlay" style="display:none;">
      <div id="modal-content" class="modal-content"></div>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/views/common.js"></script>
  <script src="js/views/login.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/inventory.js"></script>
  <script src="js/views/pos.js"></script>
  <script src="js/views/batches.js"></script>
  <script src="js/views/purchases.js"></script>
  <script src="js/views/sales.js"></script>
  <script src="js/views/suppliers.js"></script>
  <script src="js/views/categories.js"></script>
  <script src="js/views/patients.js"></script>
  <script src="js/views/prescriptions.js"></script>
  <script src="js/views/users.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>
