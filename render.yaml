services:
  - type: web
    name: pharmly-pms
    env: node
    plan: free
    region: oregon
    buildCommand: cd backend && npm install --include=dev && npm rebuild sqlite3 && npm run build
    startCommand: cd backend && npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: api/v1
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: 10
      - key: CORS_ORIGINS
        value: https://pharmly-pms.onrender.com,http://localhost:3000,http://localhost:5500
