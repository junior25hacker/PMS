name: Pharmly CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run TypeCheck
        working-directory: backend
        run: npm run typecheck

      - name: Run Test Suite
        working-directory: backend
        run: npm test

      - name: Build Application
        working-directory: backend
        run: npm run build

  deploy-to-render:
    name: Deploy to Render
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deploy Hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "Triggering Render deployment hook..."
            curl -sS -f -X POST "$DEPLOY_HOOK"
            echo "Deployment request sent to Render successfully."
          else
            echo "RENDER_DEPLOY_HOOK_URL secret is not set. Render will deploy automatically if connected via GitHub auto-deploy."
          fi
